  <div class="stage">
    <main id="map"></main>
    <p id="map-note" class="map-note" hidden></p>

    <header class="panel-head">
      <div class="title-row">
        <h1>Магниты</h1>

      <input id="q" type="search" placeholder="Название" autocomplete="off">
